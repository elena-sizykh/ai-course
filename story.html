<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #07080f;
      color: #f1f3ff;
      position: relative;
    }

    .blob { position: absolute; border-radius: 50%; filter: blur(120px); pointer-events: none; }
    .blob-1 { width: 900px; height: 900px; background: #a855f7; top: -300px; left: -300px; opacity: .25; }
    .blob-2 { width: 700px; height: 700px; background: #22d3ee; bottom: 100px; right: -200px; opacity: .2; }
    .blob-3 { width: 600px; height: 600px; background: #f472b6; top: 45%; left: 10%; opacity: .15; }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1;
      opacity: .6;
    }

    .wrap {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 90px 80px 90px;
    }

    .meme {
      background: rgba(255,255,255,.04);
      border: 1.5px solid rgba(255,255,255,.1);
      backdrop-filter: blur(24px);
      border-radius: 32px;
      padding: 64px 70px;
      margin-bottom: 64px;
    }
    .meme-line { display: flex; align-items: flex-start; gap: 24px; margin-bottom: 36px; }
    .meme-line:last-child { margin-bottom: 0; }
    .meme-time { font-size: 26px; font-weight: 800; color: #c084fc; white-space: nowrap; padding-top: 4px; min-width: 220px; }
    .meme-time.cyan { color: #22d3ee; }
    .meme-text { font-size: 34px; font-weight: 600; color: #f1f3ff; line-height: 1.4; }
    .meme-text em { font-style: normal; color: #7c82a8; }

    .divider { width: 100%; height: 1.5px; background: linear-gradient(90deg, transparent, rgba(168,85,247,.5), rgba(34,211,238,.4), transparent); margin-bottom: 64px; }

    .headline { font-size: 96px; font-weight: 900; line-height: 1.0; letter-spacing: -.03em; margin-bottom: 32px; }
    .grad { background: linear-gradient(135deg, #c084fc 0%, #22d3ee 50%, #f472b6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

    .subline { font-size: 38px; color: #7c82a8; line-height: 1.55; }

    .cta-wrap { margin-top: auto; display: flex; flex-direction: column; align-items: center; }
    .cta-btn {
      width: 100%;
      background: linear-gradient(135deg, #a855f7, #7c3aed);
      height: 140px;
      border-radius: 999px;
      box-shadow: 0 0 80px rgba(168,85,247,.5);
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="wrap">
    <div class="meme">
      <div class="meme-line">
        <div class="meme-time">Понедельник</div>
        <div class="meme-text">«Может собрать группу...»</div>
      </div>
      <div class="meme-line">
        <div class="meme-time cyan">Вторник</div>
        <div class="meme-text">лендинг готов<br><em>спасибо, Claude</em></div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="headline"><span class="grad">ИИ в жизнь:</span><br>старт с нуля</div>
    <div class="subline">Именно этому и учу — делать<br>быстро, без лишних слов</div>
    <div class="cta-wrap">
      <div class="cta-btn"></div>
    </div>
  </div>
</body>
</html>
