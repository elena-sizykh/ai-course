<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИИ в жизнь — Материалы</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%23c084fc'/><stop offset='50%25' stop-color='%2322d3ee'/><stop offset='100%25' stop-color='%23f472b6'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='%2307080f'/><text x='16' y='22' text-anchor='middle' font-size='18' fill='url(%23g)'>&#x2726;</text></svg>" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#07080f;font-family:'Inter',-apple-system,sans-serif;background-image:radial-gradient(ellipse 60% 50% at 50% -10%,rgba(168,85,247,.18) 0,transparent 70%)}
.card{background:rgba(168,85,247,.07);border:1.5px solid rgba(168,85,247,.3);backdrop-filter:blur(20px);border-radius:24px;padding:48px 44px;text-align:center;max-width:460px;width:90%;box-shadow:0 0 80px rgba(168,85,247,.1)}
.logo{font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#a855f7;margin-bottom:32px}
h1{font-size:24px;font-weight:900;color:#f5f0ff;letter-spacing:-.02em;margin-bottom:8px}
p{color:#9b99b5;font-size:14px;margin-bottom:28px;line-height:1.6}
input[type=password]{width:100%;padding:14px 20px;background:rgba(168,85,247,.08);border:1.5px solid rgba(168,85,247,.3);border-radius:12px;color:#f5f0ff;font-size:18px;letter-spacing:.3em;text-align:center;outline:none;transition:border-color .2s;margin-bottom:16px}
input[type=password]:focus{border-color:#a855f7}
input[type=password]::placeholder{letter-spacing:normal;font-size:14px;color:#5a5875}
.btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,#a855f7,#7c3aed);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .2s;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary:hover{opacity:.85}
.err{color:#f472b6;font-size:13px;margin-top:12px;min-height:20px}
.menu{display:none;flex-direction:column;gap:12px;margin-top:4px}
.menu-btn{width:100%;padding:16px 20px;background:rgba(168,85,247,.08);border:1.5px solid rgba(168,85,247,.25);border-radius:14px;color:#f5f0ff;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;text-align:left;display:flex;align-items:center;gap:16px}
.menu-btn:hover{background:rgba(168,85,247,.16);border-color:rgba(168,85,247,.5)}
.menu-btn:disabled{opacity:.5;cursor:default}
.menu-btn svg{flex-shrink:0;opacity:.85}
.menu-loading{color:#9b99b5;font-size:13px;margin-top:8px;display:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">✦ ИИ в жизнь</div>
  <div id="gate">
    <h1>Закрытые материалы</h1>
    <p>Введи пароль, чтобы получить доступ</p>
    <input type="password" id="pw" placeholder="Пароль" maxlength="20" autofocus />
    <button class="btn-primary" onclick="unlock()">Войти</button>
    <div class="err" id="err"></div>
  </div>
  <div id="menu-wrap" style="display:none">
    <h1 style="margin-bottom:8px">Выбери материал</h1>
    <p style="margin-bottom:24px">Нажми — файл загрузится и откроется</p>
    <div class="menu" id="menu">
      <button class="menu-btn" onclick="open_file('guide')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <line x1="10" y1="9" x2="8" y2="9"/>
        </svg>
        Гайд: HTML от идеи до сайта
      </button>
      <button class="menu-btn" onclick="open_file('deck')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        Презентация «ИИ в жизнь»
      </button>
    </div>
    <div class="menu-loading" id="menu-loading">Загружаю файл…</div>
  </div>
</div>
<script>
const BASE="https://raw.githubusercontent.com/elena-sizykh/ai-course/claude/ai-course-landing-page-4kzDA/slides/";
const FILES={guide:"guide.html",deck:"deck.html"};
function unlock(){
  if(document.getElementById("pw").value!=="0000"){
    document.getElementById("err").textContent="Неверный пароль";
    document.getElementById("pw").focus();return;
  }
  document.getElementById("gate").style.display="none";
  document.getElementById("menu-wrap").style.display="block";
  document.getElementById("menu").style.display="flex";
}
async function open_file(key){
  document.querySelectorAll(".menu-btn").forEach(b=>b.disabled=true);
  document.getElementById("menu-loading").style.display="block";
  try{
    const res=await fetch(BASE+FILES[key]);
    if(!res.ok)throw new Error();
    const blob=new Blob([await res.text()],{type:"text/html"});
    location.href=URL.createObjectURL(blob);
  }catch(e){
    document.querySelectorAll(".menu-btn").forEach(b=>b.disabled=false);
    document.getElementById("menu-loading").textContent="Ошибка загрузки, попробуй снова";
  }
}
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock();});
</script>
</body>
</html>
