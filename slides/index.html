<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИИ в жизнь — Гайд</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#07080f;font-family:'Inter',-apple-system,sans-serif;background-image:radial-gradient(ellipse 60% 50% at 50% -10%,rgba(168,85,247,.18) 0,transparent 70%)}
.gate{background:rgba(168,85,247,.07);border:1.5px solid rgba(168,85,247,.3);backdrop-filter:blur(20px);border-radius:24px;padding:48px 44px;text-align:center;max-width:420px;width:90%;box-shadow:0 0 80px rgba(168,85,247,.1)}
.logo{font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#a855f7;margin-bottom:32px}
h1{font-size:24px;font-weight:900;color:#f5f0ff;letter-spacing:-.02em;margin-bottom:8px}
p{color:#9b99b5;font-size:14px;margin-bottom:28px;line-height:1.6}
input[type=password]{width:100%;padding:14px 20px;background:rgba(168,85,247,.08);border:1.5px solid rgba(168,85,247,.3);border-radius:12px;color:#f5f0ff;font-size:18px;letter-spacing:.3em;text-align:center;outline:none;transition:border-color .2s;margin-bottom:16px}
input[type=password]:focus{border-color:#a855f7}
input[type=password]::placeholder{letter-spacing:normal;font-size:14px;color:#5a5875}
button{width:100%;padding:14px;background:linear-gradient(135deg,#a855f7,#7c3aed);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .2s;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:8px}
button:hover{opacity:.85}
button:disabled{opacity:.5;cursor:default}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:#f472b6;font-size:13px;margin-top:12px;min-height:20px}
</style>
</head>
<body>
<div class="gate">
  <div class="logo">✦ ИИ в жизнь</div>
  <h1>Закрытый материал</h1>
  <p>Введи пароль, чтобы открыть гайд</p>
  <input type="password" id="pw" placeholder="Пароль" maxlength="20" autofocus />
  <button id="btn" onclick="unlock()"><span id="label">Войти</span><span class="spinner" id="spin"></span></button>
  <div class="err" id="err"></div>
</div>
<script>
const GUIDE_URL = "https://raw.githubusercontent.com/elena-sizykh/ai-course/claude/ai-course-landing-page-4kzDA/slides/guide.html";
async function unlock(){
  const pw = document.getElementById("pw").value;
  if(pw !== "0000"){
    document.getElementById("err").textContent = "Неверный пароль";
    document.getElementById("pw").focus();
    return;
  }
  const btn = document.getElementById("btn");
  btn.disabled = true;
  document.getElementById("label").textContent = "Загрузка...";
  document.getElementById("spin").style.display = "block";
  try {
    const res = await fetch(GUIDE_URL);
    if(!res.ok) throw new Error("fetch failed");
    const html = await res.text();
    const blob = new Blob([html], {type:"text/html"});
    location.href = URL.createObjectURL(blob);
  } catch(e) {
    btn.disabled = false;
    document.getElementById("label").textContent = "Войти";
    document.getElementById("spin").style.display = "none";
    document.getElementById("err").textContent = "Ошибка загрузки, попробуй снова";
  }
}
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
</script>
</body>
</html>
